<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="400" height="270" role="img" aria-label="DRI Store, toko komunitas" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#D9A441" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".01"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="bl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="34"/></filter>
    <clipPath id="c"><rect x="1" y="1" width="398" height="268" rx="28"/></clipPath>
  </defs>
  <style>
    svg{font-family:"SF Pro Display","Segoe UI",Inter,Helvetica,Arial,sans-serif}
    .tg{font-size:12px;font-weight:600;letter-spacing:.6px;fill:#D9A441}
    .ti{font-size:34px;font-weight:700;letter-spacing:-.6px;fill:#fff}
    .su{font-size:15px;font-weight:500;fill:#D9A441}
    .de{font-size:14px;fill:#B4B4BE}
    .tp{font-size:12px;font-weight:500;fill:#EDEDED}
    .o{animation:o 14s ease-in-out infinite alternate}
    @keyframes o{to{transform:translate(-90px,-50px)}}
    .sw{animation:s 7s ease-in-out infinite;animation-delay:4s}
    @keyframes s{0%{transform:translateX(-160px)}55%,100%{transform:translateX(560px)}}
    .ar{animation:n 1.8s ease-in-out infinite alternate;animation-delay:.8s}
    @keyframes n{to{transform:translate(2px,-2px)}}
    @media (prefers-reduced-motion:reduce){.o,.ar{animation:none}.sw{display:none}}
  </style>

  <g clip-path="url(#c)">
    <rect width="400" height="270" fill="#0B0B0F"/>
    <g filter="url(#bl)"><circle class="o" cx="340" cy="260" r="80" fill="#D9A441" opacity=".4"/></g>
    <rect width="400" height="270" fill="url(#glass)"/>
    <g class="sw"><rect x="0" y="-20" width="90" height="320" fill="url(#sh)" transform="skewX(-16)"/></g>
  </g>
  <rect x="1" y="1" width="398" height="268" rx="28" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <text class="tg" x="28" y="50">Toko · Website</text>
  <text class="ti" x="28" y="98">DRI Store</text>
  <text class="su" x="28" y="124">Toko komunitas</text>

  <text class="de" x="28" y="160">Etalase hitam-emas dengan kartu 3D,</text>
  <text class="de" x="28" y="180">particle canvas, kursor custom,</text>
  <text class="de" x="28" y="200">plus sistem webhook Discord.</text>

  <rect x="28" y="226" width="62" height="26" rx="13" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/>
  <text class="tp" x="59" y="243.5" text-anchor="middle">Canvas</text>
  <rect x="98" y="226" width="81" height="26" rx="13" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/>
  <text class="tp" x="138.5" y="243.5" text-anchor="middle">Web Audio</text>
  <rect x="187" y="226" width="74" height="26" rx="13" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/>
  <text class="tp" x="224" y="243.5" text-anchor="middle">Webhooks</text>

  <g transform="translate(364 239)">
    <circle r="15" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".22"/>
    <g class="ar"><path d="M-4.5 4.5L4.5 -4.5M-1 -4.5H4.5V1" stroke="#D9A441" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
</svg>
