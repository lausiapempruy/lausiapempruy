<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-label="Tech stack: Web, Roblox, dan Komunitas" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="bl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="fr"><rect width="1000" height="270" rx="30"/></clipPath>
    <linearGradient id="ps" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".04"/>
    </linearGradient>
  </defs>
  <style>
    svg{font-family:"SF Pro Display","Segoe UI",Inter,Helvetica,Arial,sans-serif}
    .k{font-size:15px;font-weight:600;fill:#D9A441}
    .v{font-size:14px;font-weight:500;fill:#EDEDED}
    .p{animation:fl 6s ease-in-out infinite alternate}
    @keyframes fl{to{transform:translateY(-4px)}}
    .o{animation:dr 18s ease-in-out infinite alternate}
    @keyframes dr{to{transform:translate(120px,-30px)}}
    @media (prefers-reduced-motion:reduce){.p,.o{animation:none}}
  </style>

  <g clip-path="url(#fr)">
    <rect width="1000" height="270" fill="#0B0B0F"/>
    <g filter="url(#bl)">
      <circle class="o" cx="120" cy="250" r="110" fill="#E2231A" opacity=".35"/>
      <circle cx="880" cy="30" r="100" fill="#D9A441" opacity=".3"/>
    </g>
  </g>
  <rect x=".75" y=".75" width="998.5" height="268.5" rx="29.5" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="1.5"/>

  <!-- Web -->
  <text class="k" x="48" y="75">Web</text>
  <g class="p" style="animation-delay:-.5s"><rect x="150" y="53" width="80" height="34" rx="17" fill="url(#ps)" stroke="#fff" stroke-opacity=".18"/><circle cx="166" cy="70" r="3.5" fill="#E2231A"/><text class="v" x="197" y="75" text-anchor="middle">HTML5</text></g>
  <g class="p" style="animation-delay:-1.4s"><rect x="240" y="53" width="72" height="34" rx="17" fill="url(#ps)" stroke="#fff" stroke-opacity=".18"/><circle cx="256" cy="70" r="3.5" fill="#E2231A"/><text class="v" x="283" y="75" text-anchor="middle">CSS3</text></g>
  <g class="p" style="animation-delay:-2.3s"><rect x="322" y="53" width="152" height="34" rx="17" fill="url(#ps)" stroke="#fff" stroke-opacity=".18"/><circle cx="338" cy="70" r="3.5" fill="#E2231A"/><text class="v" x="405" y="75" text-anchor="middle">JavaScript ES5</text></g>
  <g class="p" style="animation-delay:-3.1s"><rect x="484" y="53" width="136" height="34" rx="17" fill="url(#ps)" stroke="#fff" stroke-opacity=".18"/><circle cx="500" cy="70" r="3.5" fill="#E2231A"/><text class="v" x="559" y="75" text-anchor="middle">SVG &amp; Canvas</text></g>
  <g class="p" style="animation-delay:-4s"><rect x="630" y="53" width="144" height="34" rx="17" fill="url(#ps)" stroke="#fff" stroke-opacity=".18"/><circle cx="646" cy="70" r="3.5" fill="#E2231A"/><text class="v" x="709" y="75" text-anchor="middle">Web Audio API</text></g>
  <g class="p" style="animation-delay:-4.8s"><rect x="784" y="53" width="136" height="34" rx="17" fill="url(#ps)" stroke="#fff" stroke-opacity=".18"/><circle cx="800" cy="70" r="3.5" fill="#E2231A"/><text class="v" x="859" y="75" text-anchor="middle">GitHub Pages</text></g>

  <!-- Roblox -->
  <text class="k" x="48" y="140">Roblox</text>
  <g class="p" style="animation-delay:-1s"><rect x="150" y="118" width="72" height="34" rx="17" fill="url(#ps)" stroke="#fff" stroke-opacity=".18"/><circle cx="166" cy="135" r="3.5" fill="#D9A441"/><text class="v" x="193" y="140" text-anchor="middle">Luau</text></g>
  <g class="p" style="animation-delay:-2s"><rect x="232" y="118" width="160" height="34" rx="17" fill="url(#ps)" stroke="#fff" stroke-opacity=".18"/><circle cx="248" cy="135" r="3.5" fill="#D9A441"/><text class="v" x="319" y="140" text-anchor="middle">MessagingService</text></g>
  <g class="p" style="animation-delay:-3s"><rect x="402" y="118" width="124" height="34" rx="17" fill="url(#ps)" stroke="#fff" stroke-opacity=".18"/><circle cx="418" cy="135" r="3.5" fill="#D9A441"/><text class="v" x="471" y="140" text-anchor="middle">TextService</text></g>
  <g class="p" style="animation-delay:-3.9s"><rect x="536" y="118" width="132" height="34" rx="17" fill="url(#ps)" stroke="#fff" stroke-opacity=".18"/><circle cx="552" cy="135" r="3.5" fill="#D9A441"/><text class="v" x="609" y="140" text-anchor="middle">TweenService</text></g>
  <g class="p" style="animation-delay:-5s"><rect x="678" y="118" width="170" height="34" rx="17" fill="url(#ps)" stroke="#fff" stroke-opacity=".18"/><circle cx="694" cy="135" r="3.5" fill="#D9A441"/><text class="v" x="770" y="140" text-anchor="middle">CollectionService</text></g>

  <!-- Komunitas -->
  <text class="k" x="48" y="205">Komunitas</text>
  <g class="p" style="animation-delay:-.8s"><rect x="150" y="183" width="94" height="34" rx="17" fill="url(#ps)" stroke="#fff" stroke-opacity=".18"/><circle cx="166" cy="200" r="3.5" fill="#EDEDED"/><text class="v" x="204" y="205" text-anchor="middle">Discord</text></g>
  <g class="p" style="animation-delay:-2.2s"><rect x="254" y="183" width="146" height="34" rx="17" fill="url(#ps)" stroke="#fff" stroke-opacity=".18"/><circle cx="270" cy="200" r="3.5" fill="#EDEDED"/><text class="v" x="334" y="205" text-anchor="middle">Webhook embeds</text></g>
  <g class="p" style="animation-delay:-3.4s"><rect x="410" y="183" width="162" height="34" rx="17" fill="url(#ps)" stroke="#fff" stroke-opacity=".18"/><circle cx="426" cy="200" r="3.5" fill="#EDEDED"/><text class="v" x="498" y="205" text-anchor="middle">Event &amp; moderasi</text></g>
  <g class="p" style="animation-delay:-4.5s"><rect x="582" y="183" width="146" height="34" rx="17" fill="url(#ps)" stroke="#fff" stroke-opacity=".18"/><circle cx="598" cy="200" r="3.5" fill="#EDEDED"/><text class="v" x="662" y="205" text-anchor="middle">Desain digital</text></g>
</svg>
