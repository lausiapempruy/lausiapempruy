<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" role="img" aria-label="Makasih udah mampir. Dibangun pakai HTML, CSS, JS, dan Luau." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="fr"><rect width="1000" height="170" rx="30"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0F"/>
      <stop offset="1" stop-color="#15151C"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2231A" stop-opacity=".55"/>
      <stop offset="1" stop-color="#E2231A" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9A441" stop-opacity=".45"/>
      <stop offset="1" stop-color="#D9A441" stop-opacity=".06"/>
    </linearGradient>
  </defs>
  <style>
    svg{font-family:"SF Pro Display","Segoe UI",Inter,Helvetica,Arial,sans-serif}
    .h{font-size:30px;font-weight:700;letter-spacing:-.5px;fill:#fff}
    .s{font-size:15px;fill:#B4B4BE}
    .u{font-family:"SF Mono",Menlo,Consolas,"Courier New",monospace;font-size:14px;fill:#D9A441}
    .a{animation:l 9s linear infinite}
    .b{animation:r 13s linear infinite}
    @keyframes l{to{transform:translateX(-500px)}}
    @keyframes r{from{transform:translateX(-500px)}to{transform:translateX(0)}}
    @media (prefers-reduced-motion:reduce){.a,.b{animation:none}}
  </style>

  <g clip-path="url(#fr)">
    <rect width="1000" height="170" fill="url(#bg)"/>
    <path class="b" fill="url(#w2)" d="M0 124 Q125 98 250 124 T500 124 T750 124 T1000 124 T1250 124 T1500 124 T1750 124 T2000 124 V170 H0Z"/>
    <path class="a" fill="url(#w1)" d="M0 138 Q125 112 250 138 T500 138 T750 138 T1000 138 T1250 138 T1500 138 T1750 138 T2000 138 V170 H0Z"/>
  </g>
  <rect x=".75" y=".75" width="998.5" height="168.5" rx="29.5" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="1.5"/>

  <text class="h" x="48" y="62">Makasih udah mampir.</text>
  <text class="s" x="48" y="90">Dibangun pakai HTML, CSS, JS, dan Luau, tanpa framework.</text>
  <text class="u" x="952" y="62" text-anchor="end">@lausiapempruy</text>
</svg>
