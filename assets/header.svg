<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Bahlil (lausiapempruy)</title>
  <desc id="d">Web developer, Roblox creator, dan community builder</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0F"/>
      <stop offset="1" stop-color="#15151C"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#E2231A" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <clipPath id="frame"><rect width="1000" height="340" rx="34"/></clipPath>
    <clipPath id="main"><rect x="56" y="46" width="640" height="248" rx="30"/></clipPath>
  </defs>
  <style>
    svg{font-family:"SF Pro Display","Segoe UI",Inter,Helvetica,Arial,sans-serif}
    .mo{font-family:"SF Mono",Menlo,Consolas,"Courier New",monospace;font-size:15px;fill:#D9A441}
    .nm{font-size:92px;font-weight:700;letter-spacing:-2.5px;fill:#fff}
    .rl{font-size:28px;font-weight:500;fill:#EDEDED}
    .lb{font-size:13px;font-weight:600;letter-spacing:.4px}
    .vl{font-size:15px;fill:#EDEDED}
    .o1{animation:a 16s ease-in-out infinite alternate}
    .o2{animation:b 19s ease-in-out infinite alternate}
    @keyframes a{to{transform:translate(150px,-60px)}}
    @keyframes b{to{transform:translate(-170px,70px)}}
    .sw{animation:s 8s ease-in-out infinite;animation-delay:1s}
    @keyframes s{0%{transform:translateX(-200px)}60%,100%{transform:translateX(900px)}}
    .r{opacity:0;animation:r 9s infinite both}
    .r2{animation-delay:3s}
    .r3{animation-delay:6s}
    @keyframes r{
      0%{opacity:0;transform:translateY(12px)}
      6%,30%{opacity:1;transform:translateY(0)}
      36%,100%{opacity:0;transform:translateY(-12px)}
    }
    @media (prefers-reduced-motion:reduce){
      .o1,.o2,.r{animation:none}
      .sw{display:none}
      .r1{opacity:1}
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="340" fill="url(#bg)"/>

    <!-- cahaya di belakang kaca: merah (DRI) kiri-bawah, emas (Store) kanan-atas -->
    <g filter="url(#blur)">
      <circle class="o1" cx="250" cy="270" r="140" fill="#E2231A" opacity=".6"/>
      <circle class="o2" cx="830" cy="80" r="115" fill="#D9A441" opacity=".5"/>
    </g>

    <!-- panel sekunder (di belakang, menimpa tepi panel utama biar ada kedalaman) -->
    <rect x="650" y="104" width="300" height="190" rx="26" fill="url(#pane)" stroke="url(#rim)" stroke-width="1.5"/>
    <text class="lb" x="682" y="146" fill="#E2231A">Web</text>
    <text class="vl" x="682" y="168">HTML, CSS, ES5 murni</text>
    <text class="lb" x="682" y="198" fill="#D9A441">Roblox</text>
    <text class="vl" x="682" y="220">Luau: chat, cuaca, bencana</text>
    <text class="lb" x="682" y="250" fill="#EDEDED">Komunitas</text>
    <text class="vl" x="682" y="272">DRI Studio · IOC · DRI Store</text>

    <!-- panel utama -->
    <rect x="56" y="46" width="640" height="248" rx="30" fill="url(#pane)" stroke="url(#rim)" stroke-width="1.5"/>
    <path d="M92 47.5H660" stroke="#fff" stroke-opacity=".3" stroke-linecap="round"/>
    <g clip-path="url(#main)">
      <g class="sw"><rect x="0" y="30" width="120" height="280" fill="url(#sheen)" transform="skewX(-16)"/></g>
    </g>

    <text class="mo" x="92" y="98">~/lausiapempruy</text>
    <text class="nm" x="88" y="184">Bahlil</text>

    <text class="rl r r1" x="92" y="236">Web Developer</text>
    <text class="rl r r2" x="92" y="236">Roblox Creator</text>
    <text class="rl r r3" x="92" y="236">Community Builder</text>
    <rect x="92" y="256" width="64" height="4" rx="2" fill="#E2231A"/>
  </g>
</svg>
