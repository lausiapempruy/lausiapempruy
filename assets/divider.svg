<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 28" width="1000" height="28" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="l">
      <stop offset="0" stop-color="#8A8A95" stop-opacity="0"/>
      <stop offset=".5" stop-color="#8A8A95" stop-opacity=".4"/>
      <stop offset="1" stop-color="#8A8A95" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="t">
      <stop offset="0" stop-color="#E2231A" stop-opacity="0"/>
      <stop offset=".7" stop-color="#E2231A"/>
      <stop offset="1" stop-color="#D9A441"/>
    </linearGradient>
  </defs>
  <style>
    .t{animation:m 6s cubic-bezier(.6,0,.4,1) infinite}
    @keyframes m{from{transform:translateX(-160px)}to{transform:translateX(1000px)}}
    @media (prefers-reduced-motion:reduce){.t{animation:none;opacity:0}}
  </style>
  <rect x="0" y="13" width="1000" height="1.5" fill="url(#l)"/>
  <g class="t"><rect x="0" y="12.25" width="160" height="3" rx="1.5" fill="url(#t)"/></g>
